spring.application.name=aapliChawdi

server.port = 9999

# ===============================
# MySQL Database Configuration
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/chawli
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===============================
# Telegram client details
# ===============================
telegram.bot.token=${TELEGRAM_BOT_TOKEN}

# ===============================
# Playwright properties
# ===============================
playwright.headless=false
playwright.slowMo=1000

# OpenAPI / Swagger UI
springdoc.packages-to-scan=com.example.aapliChawdi.controller
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
